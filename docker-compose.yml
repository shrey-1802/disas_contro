version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: disista-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:-mysql://21oR7kYsZBTwtTx.root:6Mku0PHqSvdMi4hD@gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/test?sslaccept=strict}
      - JWT_SECRET=${JWT_SECRET:-disista_super_secret_jwt_key_2026}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:8080,https://localhost:8080}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: disista-frontend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
    depends_on:
      - backend
