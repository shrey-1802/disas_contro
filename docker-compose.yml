version: '3.9'

services:
  db:
    image: mysql:8.0
    container_name: relief_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: relief_supply_chain
      MYSQL_USER: relief_user
      MYSQL_PASSWORD: relief_password_123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s
    networks:
      - relief_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: relief_backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "mysql://relief_user:relief_password_123@db:3306/relief_supply_chain"
      JWT_SECRET: ${JWT_SECRET:-disaster_relief_jwt_secret_production_key_2026}
      CORS_ORIGIN: "http://localhost:8080,http://localhost:3000"
      GRAPHHOPPER_API_KEY: ${GRAPHHOPPER_API_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/v1/health"]
      timeout: 10s
      retries: 5
      interval: 10s
    networks:
      - relief_network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: relief_frontend
    environment:
      PORT: 8080
      API_BASE_URL: "http://localhost:3000/api/v1"
      SOCKET_URL: "http://localhost:3000"
      ENABLE_QUICK_LOGIN: "false"
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - relief_network
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local

networks:
  relief_network:
    driver: bridge
