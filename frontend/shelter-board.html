<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DISISTA CONTROL — Shelter Demand & Urgency Board</title>
  <meta name="description" content="Relief Shelter Reachability, Supply Cover Telemetry, and Emergency Rebalancing Board">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">

  <style>
    /* Shelter Board Grid Layout */
    .summary-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: var(--space-4);
      margin-bottom: var(--space-5);
    }

    .metric-card {
      background: var(--white);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius);
      padding: var(--space-4);
    }

    .shelter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: var(--space-5);
      margin-bottom: var(--space-6);
    }

    .shelter-card {
      position: relative;
      transition: border-color var(--motion-fast) var(--ease);
    }

    .shelter-card.isolated-card {
      border: 2px solid var(--slate-800) !important;
      background: #FAF7F6;
    }

    .shelter-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: var(--space-3);
    }

    .days-cover-display {
      background: var(--bg-honeydew);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius);
      padding: var(--space-3);
      text-align: center;
      margin-bottom: var(--space-4);
    }

    .days-cover-numeral {
      font-size: 32px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }

    .days-cover-numeral.critical { color: var(--slate-800); }
    .days-cover-numeral.caution { color: var(--forest-600); }
    .days-cover-numeral.safe { color: var(--sage-500); }

    .supply-breakdown-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-2);
      margin-top: var(--space-3);
      padding-top: var(--space-3);
      border-top: 1px solid var(--border-hairline);
      font-size: var(--text-xs);
    }

    .supply-item {
      background: var(--white);
      padding: 6px 8px;
      border-radius: 4px;
      border: 1px solid var(--border-hairline);
    }

    .sparkline-placeholder {
      background: var(--sage-100);
      border: 1px dashed var(--border-hairline);
      border-radius: var(--radius);
      padding: var(--space-3);
      text-align: center;
      font-size: var(--text-xs);
      color: var(--slate-500);
      margin-top: var(--space-3);
    }
  </style>
</head>
<body>

  <main class="page-main">
    <div class="container" style="margin-top: var(--space-5);">

      <!-- PAGE HEADER -->
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-5);">
        <div>
          <span class="panel-label">REGIONAL DEMAND TELEMETRY</span>
          <h2>Shelter Supply Cover & Reachability Board</h2>
        </div>

        <div style="display: flex; gap: var(--space-2);">
          <span class="badge badge-safe" id="district-scope-badge">District 4 (Northern Rift)</span>
          <button class="btn btn-primary" onclick="shelterBoard.openRequestModal()">+ Request Emergency Rebalancing</button>
        </div>
      </div>

      <!-- METRICS STRIP -->
      <div class="summary-strip">
        <div class="metric-card">
          <span class="text-meta">TOTAL SHELTERS MONITORED</span>
          <div class="data-numeral" id="metric-shelters-count">3</div>
        </div>
        <div class="metric-card" style="border-left: 4px solid var(--slate-800);">
          <span class="text-meta">ISOLATED (NO ROAD ACCESS)</span>
          <div class="data-numeral" style="color: var(--slate-800);" id="metric-isolated-count">1</div>
        </div>
        <div class="metric-card" style="border-left: 4px solid var(--slate-800);">
          <span class="text-meta">CRITICAL SUPPLY (< 1.5 DAYS)</span>
          <div class="data-numeral" style="color: var(--slate-800);" id="metric-critical-count">2</div>
        </div>
        <div class="metric-card" style="border-left: 4px solid var(--sage-500);">
          <span class="text-meta">ADEQUATE COVER (> 3 DAYS)</span>
          <div class="data-numeral" style="color: var(--forest-700);" id="metric-safe-count">1</div>
        </div>
      </div>

      <!-- FILTERS & SORTING -->
      <div class="card" style="margin-bottom: var(--space-5); padding: var(--space-4);">
        <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-3);">
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3);">
            <div>
              <label class="panel-label" style="display: block; margin-bottom: 2px;">Urgency Tier</label>
              <select class="form-control" style="min-height: 38px;" id="filter-urgency" onchange="shelterBoard.applyFilters()">
                <option value="ALL">All Urgency Tiers</option>
                <option value="ISOLATED">Isolated & Critical Only</option>
                <option value="CRITICAL">Critical Supply (< 1.5 Days)</option>
                <option value="CAUTION">Caution Tier (1.5 - 3 Days)</option>
                <option value="SAFE">Safe Tier (> 3 Days)</option>
              </select>
            </div>

            <div>
              <label class="panel-label" style="display: block; margin-bottom: 2px;">Shortage Type</label>
              <select class="form-control" style="min-height: 38px;" id="filter-shortage" onchange="shelterBoard.applyFilters()">
                <option value="ALL">All Resource Types</option>
                <option value="medical">Medical & Insulin</option>
                <option value="water">Clean Water</option>
                <option value="food">Food Rations</option>
              </select>
            </div>
          </div>

          <button class="btn btn-secondary" onclick="shelterBoard.resetFilters()">Reset Filters</button>
        </div>
      </div>

      <!-- SHELTER CARDS GRID -->
      <div class="shelter-grid" id="shelter-cards-container">
        <!-- Rendered by JS -->
      </div>

    </div>
  </main>

  <!-- EMERGENCY REBALANCING REQUEST MODAL -->
  <div class="modal-overlay hidden" id="rebalance-modal">
    <div class="modal-card">
      <div class="card-header">
        <span class="card-title">Request Emergency Supply Rebalancing</span>
        <button style="background: none; border: none; font-size: 18px; cursor: pointer;" onclick="shelterBoard.closeRequestModal()">✕</button>
      </div>

      <form onsubmit="shelterBoard.handleRebalanceSubmit(event)">
        <div class="form-group">
          <label class="form-label" for="rebalance-shelter-select">Target Relief Shelter</label>
          <select class="form-control" id="rebalance-shelter-select" required>
            <option value="shelter-19">Shelter 19 (Island Reach) — ISOLATED (0.5 Days Cover)</option>
            <option value="shelter-12">Shelter 12 (North Community) — Critical (1.5 Days Cover)</option>
            <option value="shelter-04">Shelter 04 (Rift Valley High) — Caution (3.2 Days Cover)</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="rebalance-category">Critical Resource Needed</label>
          <select class="form-control" id="rebalance-category" required>
            <option value="Insulin/Blood">🩸 Insulin & Blood Products (Cold-Chain)</option>
            <option value="Infant Nutrition">🍼 Infant Nutrition & Emergency Food</option>
            <option value="Clean Water">💧 Clean Drinking Water Containers</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="rebalance-qty">Requested Quantity (Units / Days of Cover)</label>
          <input type="text" class="form-control" id="rebalance-qty" value="500 Units (+3 Days Cover)" required>
        </div>

        <div style="display: flex; gap: var(--space-3); margin-top: var(--space-4);">
          <button type="button" class="btn btn-secondary" style="flex: 1;" onclick="shelterBoard.closeRequestModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" style="flex: 2;">SUBMIT REBALANCING REQUEST →</button>
        </div>
      </form>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="js/auth.js"></script>
  <script src="js/statusBadge.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/pages/shelterBoard.js"></script>

</body>
</html>
