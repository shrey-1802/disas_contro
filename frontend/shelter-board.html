<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Shelter demand and supply board monitoring population served, days of supply remaining, and isolation risks.">
  <title>Shelter & Demand Board — Relief Supply Chain Platform</title>

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS Architecture -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">

  <style>
    .shelter-card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: var(--space-lg);
    }
    .shelter-card {
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .shelter-card:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header" id="app-header"></header>

    <div class="app-body">
      <nav class="app-nav" id="app-nav" aria-label="Operational Navigation"></nav>

      <main class="app-main" id="main-content">
        <header style="display:flex; justify-content:space-between; align-items:center;">
          <div>
            <h1>Shelter & Demand Board</h1>
            <p class="text-sm" style="color:var(--slate-600);">Monitor shelter population needs, essential medical/water supply reserves, and isolation vulnerability.</p>
          </div>
          <div>
            <button class="button button--secondary" id="btn-export-report">📊 Export Supply Report</button>
          </div>
        </header>

        <!-- Filter & Sort Bar -->
        <div class="filter-bar" style="flex-wrap: wrap;">
          <div class="flex items-center gap-sm">
            <span class="text-xs font-bold uppercase">Urgency:</span>
            <select style="width:auto;" id="filter-urgency">
              <option value="all">All Urgency Tiers</option>
              <option value="critical">Critical (&lt; 1.0 Day Supply)</option>
              <option value="caution">Caution (1.0 – 3.0 Days)</option>
              <option value="safe">Safe (&gt; 3.0 Days)</option>
            </select>
          </div>

          <div class="flex items-center gap-sm">
            <span class="text-xs font-bold uppercase">Region:</span>
            <select style="width:auto;" id="filter-region">
              <option value="all">All Regions</option>
              <option value="Sector 4">East Valley Sector 4</option>
              <option value="Sector 1">Central Sector 1</option>
              <option value="Sector 6">River Basin Sector 6</option>
              <option value="Central District">Central District</option>
            </select>
          </div>

          <div class="flex items-center gap-sm">
            <span class="text-xs font-bold uppercase">Shortage Type:</span>
            <select style="width:auto;" id="filter-shortage">
              <option value="all">All Shortages</option>
              <option value="insulin">Insulin / Blood</option>
              <option value="water">Clean Water</option>
              <option value="nutrition">Infant Nutrition</option>
            </select>
          </div>

          <div class="flex items-center gap-sm" style="margin-left: auto;">
            <span class="text-xs font-bold uppercase">Sort By:</span>
            <select style="width:auto;" id="select-sort">
              <option value="urgent">Most Urgent First</option>
              <option value="least-supply">Least Remaining Supply</option>
              <option value="eta">Nearest Convoy ETA</option>
              <option value="region">Region (Alphabetical)</option>
            </select>
          </div>
        </div>

        <!-- Shelter Grid Container -->
        <div class="shelter-card-grid" id="shelter-grid">
          <!-- Loaded dynamically via shelterBoard.js -->
        </div>
      </main>
    </div>
  </div>

  <!-- Shelter Telemetry Expansion Modal -->
  <div id="modal-shelter-detail" class="modal-overlay" style="display: none;">
    <div class="modal" style="max-width: 620px;">
      <header class="modal__header">
        <h3 style="margin:0; font-size:var(--font-size-md);" id="shelter-modal-title">Shelter Operational Telemetry</h3>
        <button id="btn-close-shelter-modal" style="background:none; border:none; color:#FFF; font-size:18px; cursor:pointer;">✕</button>
      </header>
      <div class="modal__body" id="shelter-modal-body" style="display:flex; flex-direction:column; gap:var(--space-md);">
        <!-- Loaded dynamically -->
      </div>
      <footer class="modal__footer">
        <a href="live-map.html" id="btn-modal-map-link" class="button button--secondary">🗺️ Locate on Live Map</a>
        <button type="button" class="button button--primary" id="btn-close-shelter-modal-footer">Close Telemetry</button>
      </footer>
    </div>
  </div>

  <script type="module" src="js/pages/shelterBoard.js"></script>
</body>
</html>
