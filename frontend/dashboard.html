<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Warehouse Manager Decision Center — Inventory Health, Priority Shortage Actions, and Supply Swap Opportunities.">
  <title>Warehouse Manager Decision Center — Relief Supply Chain System</title>

  <!-- Typography -->
