<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DISISTA CONTROL — Warehouse Logistics Dashboard</title>
  <meta name="description" content="Warehouse Manager Inventory & Dispatch Dashboard">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">

  <style>
    .summary-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: var(--space-4);
      margin-bottom: var(--space-5);
    }
    .metric-card {
      background: var(--white);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius);
      padding: var(--space-4);
    }
  </style>
</head>
<body>

  <main class="page-main" id="main-content">
    <div class="container" style="margin-top: var(--space-5);">
      <!-- HEADER -->
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-5);">
        <div>
          <span class="panel-label">WAREHOUSE HUB MANAGEMENT</span>
          <h2 id="wh-title">Hub Alpha (Central Depot) Dashboard</h2>
        </div>
        <div style="display: flex; gap: var(--space-2);">
          <span class="badge badge-safe">Logistics Hub</span>
          <button class="btn btn-primary" onclick="window.location.href='convoy-dispatch.html'">+ Dispatch Convoy</button>
        </div>
      </div>

      <!-- INVENTORY METRICS -->
      <div class="summary-strip">
        <div class="metric-card">
          <span class="text-meta">ON-HAND INVENTORY</span>
          <div class="data-numeral" id="metric-onhand">14,000 Units</div>
        </div>
        <div class="metric-card" style="border-left: 4px solid var(--forest-600);">
          <span class="text-meta">RESERVED FOR CONVOYS</span>
          <div class="data-numeral" id="metric-reserved" style="color: var(--forest-600);">2,000 Units</div>
        </div>
        <div class="metric-card" style="border-left: 4px solid var(--sage-500);">
          <span class="text-meta">AVAILABLE FOR DISPATCH</span>
          <div class="data-numeral" id="metric-available" style="color: var(--forest-700);">12,000 Units</div>
        </div>
        <div class="metric-card" style="border-left: 4px solid var(--slate-800);">
          <span class="text-meta">SUPPLY SWAP OPPORTUNITIES</span>
          <div class="data-numeral" id="metric-matches" style="color: var(--slate-800);">3 Matches</div>
        </div>
      </div>

      <!-- CARDS GRID -->
      <div style="display: grid; grid-template-columns: 2fr 1fr; gap: var(--space-5);">
        <div class="card">
          <div class="card-header">
            <span class="card-title">Hub Alpha Active Convoys</span>
            <button class="btn btn-secondary" onclick="window.location.href='convoy-dispatch.html'">View Dispatch Board →</button>
          </div>
          <div class="table-container">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Convoy Name</th>
                  <th>Cargo</th>
                  <th>Destination</th>
                  <th>Status</th>
                  <th>ETA</th>
                </tr>
              </thead>
              <tbody id="dashboard-convoys-body">
                <!-- Rendered dynamically by JS -->
              </tbody>
            </table>
          </div>
        </div>

        <div id="forecast-card-container">
          <!-- Rendered by JS -->
        </div>
      </div>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/statusBadge.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/store.js"></script>
  <script src="js/socket.js"></script>
  <script src="js/shared/search.js"></script>
  <script src="js/shared/a11y.js"></script>
  <script src="js/shared/freshness.js"></script>
  <script src="js/shared/loading.js"></script>
  <script src="js/shared/empty.js"></script>
  <script src="js/shared/error.js"></script>
  <script src="js/shared/copy.js"></script>
  <script src="js/offlineQueue.js"></script>
  <script src="js/globalSearch.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/pages/dashboard.js"></script>
</body>
</html>
