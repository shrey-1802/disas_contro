<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DISISTA CONTROL — Alerts Inbox & Escalations</title>
  <meta name="description" content="Operational Critical Alerts & Escalation Inbox">

  <link rel="stylesheet" href="css/tokens.css?v=2.0">
  <link rel="stylesheet" href="css/base.css?v=2.0">
  <link rel="stylesheet" href="css/components.css?v=2.0">
</head>

<body>

  <main class="page-main" id="main-content">
    <div class="container" style="margin-top: var(--space-5);">
      <!-- HEADER -->
      <div
        style="display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-5); flex-wrap: wrap; gap: var(--space-3);">
        <div>
          <span class="panel-label">COMMAND CENTER ALERTS</span>
          <h1 style="margin-top: 2px;">Alerts Inbox & Escalations</h1>
        </div>
        <span id="active-critical-count" class="badge badge-blocked">
          <svg class="badge-icon" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd"
              d="M6.267 3.455a1 1 0 01.707-.293h6.052a1 1 0 01.707.293l4.52 4.52a1 1 0 01.293.707v6.052a1 1 0 01-.293.707l-4.52 4.52a1 1 0 01-.707.293H6.974a1 1 0 01-.707-.293l-4.52-4.52A1 1 0 011.454 14.52V8.468a1 1 0 01.293-.707l4.52-4.52zM9 6a1 1 0 012 0v4a1 1 0 11-2 0V6zm1 8a1 1 0 100-2 1 1 0 000 2z"
              clip-rule="evenodd" />
          </svg>
          1 Critical Active
        </span>
      </div>

      <div class="card" style="margin-bottom: var(--space-6);">
        <div class="card-header">
          <span class="card-title">System-Wide Critical Alerts Feed</span>
          <button class="btn btn-secondary" onclick="alertsManager.ackAll()">Acknowledge All</button>
        </div>

        <div id="alerts-list" style="display: flex; flex-direction: column; gap: var(--space-3);">
          <!-- Rendered dynamically by alerts.js -->
        </div>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="app-footer">
    <div>
      <strong>DISISTA CONTROL</strong> v2.4 — Emergency Relief Supply Chain Resilience
    </div>
    <div style="display: flex; gap: var(--space-4);">
      <span class="badge badge-safe">
        <svg class="badge-icon" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd"
            d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
            clip-rule="evenodd" />
        </svg>
        4-Hue Palette System
      </span>
      <span>♿ WCAG AA</span>
    </div>
  </footer>

  <script src="js/auth.js"></script>
  <script src="js/statusBadge.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/store.js"></script>
  <script src="js/socket.js"></script>
  <script src="js/shared/search.js"></script>
  <script src="js/shared/a11y.js"></script>
  <script src="js/shared/freshness.js"></script>
  <script src="js/shared/loading.js"></script>
  <script src="js/shared/empty.js"></script>
  <script src="js/shared/error.js"></script>
  <script src="js/shared/copy.js"></script>
  <script src="js/offlineQueue.js"></script>
  <script src="js/globalSearch.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/pages/alerts.js"></script>
</body>

</html>
