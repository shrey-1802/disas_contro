<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DISISTA CONTROL — Alerts Inbox & Escalations</title>
  <meta name="description" content="Operational Critical Alerts & Escalation Inbox">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <main class="page-main">
    <div class="container" style="margin-top: var(--space-5);">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-5);">
        <div>
          <span class="panel-label">COMMAND CENTER ALERTS</span>
          <h2>Alerts Inbox & Escalations</h2>
        </div>
        <span class="badge badge-blocked">1 Critical Active</span>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title">System-Wide Critical Alerts Feed</span>
          <button class="btn btn-secondary" onclick="ackAll()">Acknowledge All</button>
        </div>

        <div id="alerts-list" style="display: flex; flex-direction: column; gap: var(--space-3);">
          <div class="card critical" style="background: var(--bg-honeydew);">
            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
              <div>
                <span class="badge badge-blocked" style="margin-bottom: 6px;">❖ CRITICAL ALERT</span>
                <h4>Isolated Shelter Detected — Shelter 19 (Island Reach)</h4>
                <p style="font-size: var(--text-sm); color: var(--slate-500); margin-top: 4px;">
                  Shelter 19 has 0.5 days supply remaining with NO viable road path from any warehouse depot due to Bridge B14 closure.
                </p>
              </div>
              <button class="btn btn-primary" style="min-height: 34px; font-size: 11px;" onclick="toast.acknowledgeBanner()">Acknowledge Alert</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/statusBadge.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>

  <script>
    function ackAll() {
      toast.success('All operational alerts acknowledged.');
    }
  </script>
</body>
</html>
