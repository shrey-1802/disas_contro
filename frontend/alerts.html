<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Emergency alert inbox and command action center for disaster response operators.">
  <title>Alerts & Command Center — Relief Supply Chain Platform</title>

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS Architecture -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header" id="app-header"></header>

    <div class="app-body">
      <nav class="app-nav" id="app-nav" aria-label="Operational Navigation"></nav>

      <main class="app-main" id="main-content">
        <header style="display:flex; justify-content:space-between; align-items:center;">
          <div>
            <h1>Alerts & Command Center</h1>
            <p class="text-sm" style="color:var(--slate-600);">Operational alert inbox, severity escalations, and command room acknowledgment actions.</p>
          </div>
          <div>
            <button class="button button--secondary" id="btn-clear-ack">Clear Acknowledged</button>
          </div>
        </header>

        <!-- Filter Bar -->
        <div class="filter-bar" style="flex-wrap: wrap;">
          <div class="flex items-center gap-sm">
            <span class="text-xs font-bold uppercase">Severity Tier:</span>
            <select style="width:auto;" id="filter-severity">
              <option value="all">All Severities</option>
              <option value="critical">Critical Only</option>
              <option value="warning">Warning Only</option>
              <option value="advisory">Advisory Only</option>
            </select>
          </div>

          <div class="flex items-center gap-sm">
            <span class="text-xs font-bold uppercase">Acknowledgment State:</span>
            <select style="width:auto;" id="filter-state">
              <option value="all">All States</option>
              <option value="pending">Pending / Unacknowledged</option>
              <option value="acknowledged">Acknowledged Only</option>
              <option value="escalated">Escalated Only</option>
            </select>
          </div>
        </div>

        <!-- Alerts Inbox Container -->
        <div style="display:flex; flex-direction:column; gap:var(--space-md);" id="alerts-container">
          <!-- Loaded dynamically via alerts.js -->
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="js/pages/alerts.js"></script>
</body>
</html>
