<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DISISTA CONTROL — Field Hazard Observation Feed</title>
  <meta name="description" content="Field Hazard Observation Log & Driver Reporting Portal">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <main class="page-main">
    <div class="container" style="margin-top: var(--space-5);">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-5);">
        <div>
          <span class="panel-label">FIELD INCIDENT REPORTING</span>
          <h2>Hazard Observation Log & Field Reports</h2>
        </div>
        <span class="badge badge-safe">Field Ops Active</span>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-5);">
        <!-- FIELD DRIVER REPORT FORM -->
        <div class="card">
          <div class="card-header">
            <span class="card-title">⚠️ Submit Field Hazard Report</span>
            <span class="badge badge-caution">Auto-GPS Geolocated</span>
          </div>

          <form onsubmit="handleHazardSubmit(event)">
            <div class="form-group">
              <label class="form-label" for="hazard-loc">Hazard Location / Road Segment</label>
              <input type="text" class="form-control" id="hazard-loc" value="Route 4 — Mile 14.2 (Lat 14.625, Lng 120.980)" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="hazard-type">Observed Problem Type</label>
              <select class="form-control" id="hazard-type" required>
                <option value="Flash Flood">🌊 Flash Flood / High Water Depth</option>
                <option value="Bridge Structural Fail">🌉 Bridge Structural Failure / Submerged</option>
                <option value="Landslide Debris">🪨 Landslide / Debris Blockage</option>
                <option value="Civil Unrest">⚠️ Route Blocked by Unrest</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="hazard-severity">Severity Level</label>
              <select class="form-control" id="hazard-severity" required>
                <option value="hazardous">Hazardous (Caution — Slow Clearance)</option>
                <option value="impassable">Impassable (Blocked — Road Closed)</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="hazard-desc">Observation Details</label>
              <textarea class="form-control" id="hazard-desc" rows="3" placeholder="Describe water depth, vehicle clearance limitations, or visible damage..."></textarea>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; min-height: 48px;">
              ⚡ SUBMIT FIELD REPORT TO CONTROL ROOM →
            </button>
          </form>
        </div>

        <!-- HAZARD FEED -->
        <div class="card">
          <div class="card-header">
            <span class="card-title">Recent Hazard Reports Feed</span>
            <span class="text-meta">Reverse Chronological</span>
          </div>

          <div id="hazard-feed-container" style="display: flex; flex-direction: column; gap: var(--space-3);">
            <!-- Rendered by JS -->
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/statusBadge.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>

  <script>
    const reports = [
      { id: 'rep-101', source: 'Field Driver (Unit 4)', type: 'Flash Flood', severity: 'hazardous', loc: 'Route 4 — Mile 12', time: '10 mins ago', confidence: 85, confirmed: false },
      { id: 'rep-102', source: 'Satellite Radar', type: 'Bridge Structural Fail', severity: 'impassable', loc: 'Bridge B14', time: '25 mins ago', confidence: 98, confirmed: true }
    ];

    document.addEventListener('DOMContentLoaded', renderFeed);

    function renderFeed() {
      const container = document.getElementById('hazard-feed-container');
      container.innerHTML = '';

      reports.forEach(r => {
        const badge = statusBadge.render(r.severity, { confirmed: r.confirmed, label: r.severity.toUpperCase() });
        const canVerify = auth.canPerform('verify_hazard') && !r.confirmed;

        const div = document.createElement('div');
        div.style.cssText = 'background: var(--bg-honeydew); padding: var(--space-3); border-radius: var(--radius); border: 1px solid var(--border-hairline);';
        div.innerHTML = `
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;">
            <strong>${r.type} @ ${r.loc}</strong>
            ${badge}
          </div>
          <div class="text-meta">Source: ${r.source} · ${r.time} · Confidence: ${r.confidence}%</div>
          ${canVerify ? `
            <button class="btn btn-secondary" style="margin-top: 8px; min-height: 32px; font-size: 11px;" onclick="verifyReport('${r.id}')">
              ✓ Verify Report
            </button>
          ` : ''}
        `;
        container.appendChild(div);
      });
    }

    function handleHazardSubmit(e) {
      e.preventDefault();
      const loc = document.getElementById('hazard-loc').value;
      const type = document.getElementById('hazard-type').value;
      const sev = document.getElementById('hazard-severity').value;

      reports.unshift({
        id: `rep-${Date.now()}`,
        source: `${auth.getCurrentUser() ? auth.getCurrentUser().username : 'Field Driver'}`,
        type: type,
        severity: sev,
        loc: loc,
        time: 'Just now',
        confidence: 80,
        confirmed: false
      });

      renderFeed();
      toast.success(`Field hazard report submitted for ${loc}! Fusion pipeline processing...`);
    }

    function verifyReport(id) {
      const rep = reports.find(r => r.id === id);
      if (rep) {
        rep.confirmed = true;
        rep.confidence = 100;
        renderFeed();
        toast.success(`Report ${id} verified by Control Room! Status promoted.`);
      }
    }
  </script>
</body>
</html>
