<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DISISTA CONTROL — Relief Route Intelligence</title>
  <base href="./">
  <script src="js/env.js"></script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">

</head>
<body>
  <script src="js/auth.js"></script>
  <script>
    (function runRedirect() {
      function doRedirect() {
        try {
          const user = window.auth && typeof window.auth.getCurrentUser === 'function'
            ? auth.getCurrentUser()
            : null;

          if (user && user.role) {
            const roleConfig = window.ROLES ? Object.values(ROLES).find(r => r.id === user.role) : null;
            if (roleConfig) {
              // Prefer the AuthManager resolver for absolute URLs when available
              const target = (window.auth && typeof window.auth._resolveTargetUrl === 'function')
                ? auth._resolveTargetUrl(roleConfig.defaultScreen)
                : roleConfig.defaultScreen;
              window.location.href = target;
              return;
            }
          }
        } catch (e) {
          // If anything goes wrong, fall through to login redirect
          console.error('Redirect check failed:', e);
        }

        const loginTarget = (window.auth && typeof window.auth._resolveTargetUrl === 'function')
          ? auth._resolveTargetUrl('login.html')
          : 'login.html';
        window.location.href = loginTarget;
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', doRedirect);
      } else {
        doRedirect();
      }
    })();
  </script>
</body>
</html>
